<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyx</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* --- Фоновый слой с точками --- */
        #dots-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0;
            will-change: opacity, transform;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: #111111;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 44px 48px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .sub {
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555555;
            margin-bottom: 32px;
        }

        .divider {
            height: 1px;
            background: #222222;
            margin: 28px 0;
        }

        p.greeting {
            font-size: 0.92rem;
            line-height: 1.8;
            color: #999999;
            margin-bottom: 4px;
        }

        .rules {
            list-style: none;
            margin-top: 8px;
        }

        .rules li {
            font-size: 0.88rem;
            color: #b0b0b0;
            padding: 7px 0;
            line-height: 1.5;
            display: flex;
            gap: 14px;
        }

        .rules li::before {
            content: '—';
            color: #444444;
            flex-shrink: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666666;
        }

        .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0.8;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 24px;
                border-radius: 8px;
            }

            h1 {
                font-size: 1.3rem;
                letter-spacing: 4px;
            }

            .sub {
                font-size: 0.65rem;
                letter-spacing: 2px;
                margin-bottom: 24px;
            }

            .divider {
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>

    <div id="dots-layer"></div>

    <div class="card">

        <h1>Onyx Sandbox</h1>
        <div class="sub">sandbox</div>

        <div class="divider"></div>

        <p class="greeting">
            приветствуем тебя на Onyx.
            <br> как хороший человек, придерживайся нескольких простых правил
        </p>

        <div class="divider"></div>

        <ul class="rules">
            <li>без читов и эксплойтов</li>
            <li>уважай других игроков</li>
            <li>никакого спама в чате и голосовом</li>
            <li>рп-отыгрыш приветствуется</li>
        </ul>

        <div class="divider"></div>

        <div class="status">
            <span class="dot"></span>
            <span>. . 66 tickrate</span>
        </div>

    </div>

    <script>
        (function () {
            const layer = document.getElementById('dots-layer');
            const MAX_DOTS = 40;        // сколько точек живёт одновременно
            const SPAWN_INTERVAL = 70; // мс между попытками создать точку
            const active = new Set();

            function rand(min, max) {
                return Math.random() * (max - min) + min;
            }

            function spawnDot() {
                if (active.size >= MAX_DOTS) return;

                const dot = document.createElement('div');
                dot.className = 'dot';

                // размер: от 2 до 5 px — мелкие, ненавязчивые
                const size = rand(2, 5);
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';

                // позиция: по всему окну, с небольшим отступом от краёв
                dot.style.left = rand(2, 98) + '%';
                dot.style.top = rand(2, 98) + '%';

                // длительность жизни и анимации — рандом, чтобы не синхронно
                const lifeMs = rand(2500, 5000);
                const fadeIn = rand(600, 1200);
                const fadeOut = rand(800, 1600);

                layer.appendChild(dot);
                active.add(dot);

                // появление
                requestAnimationFrame(() => {
                    dot.style.transition = `opacity ${fadeIn}ms ease-in-out`;
                    dot.style.opacity = rand(0.15, 0.45).toFixed(2);
                });

                // исчезновение и удаление
                setTimeout(() => {
                    dot.style.transition = `opacity ${fadeOut}ms ease-in-out`;
                    dot.style.opacity = '0';
                    setTimeout(() => {
                        dot.remove();
                        active.delete(dot);
                    }, fadeOut + 50);
                }, lifeMs);
            }

            // интервал спавна + небольшой джиттер через setTimeout-цепочку
            function loop() {
                spawnDot();
                // случайный интервал 500–1100 мс, чтобы точки шли «волнами»
                setTimeout(loop, rand(500, 1100));
            }

            // старт с небольшой задержкой, чтобы карточка успела появиться
            setTimeout(loop, 300);

            // при ресайзе ничего не ломается — позиции в процентах
        })();
    </script>

</body>
</html>
